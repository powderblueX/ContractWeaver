# Local deployment topology: private API configuration, separate user-data volume, public frontend.
name: contractweaver
services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      LAW_ENV_FILE: /run/secrets/backend_environment
      LAW_DATABASE_PATH: /app/data/contractweaver.db
      LAW_GENERATED_DIR: /app/data/generated
      LAW_RESOURCES_DIR: /app/resources/contracts
      LAW_EMBEDDING_MODEL_PATH: ""
    secrets:
      - backend_environment
    volumes:
      - contract_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${CONTRACTWEAVER_BIND_ADDRESS:-127.0.0.1}:${CONTRACTWEAVER_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  backend_environment:
    file: ./backend/.env
volumes:
  contract_data:
